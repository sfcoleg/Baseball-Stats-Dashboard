name: Daily data refresh

on:
  schedule:
    # Times are UTC; 13:00 UTC is 06:00 Pacific in summer, 05:00 in winter
    # (GitHub cron has no DST awareness, so one UTC hour cannot be 6am
    # Pacific year-round).
    #
    # These are RETRIES, not extra refreshes, and the spread is wide on
    # purpose. GitHub runs scheduled jobs best-effort: observed delays on
    # this repo range from 30 minutes to over seven hours, and on 2026-08-27
    # the 13:00 slot was dropped with no run recorded at all. A cluster of
    # slots inside one narrow window is therefore no protection — if that
    # window is being deprioritised, every slot in it misses together.
    #
    # Each run asks `refresh_data.py --check`, which tests whether the DATA
    # is behind rather than whether a job has run, so a slot that fires at
    # any hour still does the right thing and the rest cost a few seconds.
    - cron: "0 13,16,19,22 * * *"
  workflow_dispatch: {}  # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

# Never let two refreshes write data/stats.db at once — a retry slot must
# not race a still-running earlier slot.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # This step's own exit code is NOT trusted on its own. On 2026-08-29
      # we found that a crash here (a missing dependency — this step runs
      # BEFORE "Install dependencies", on purpose, so a day needing nothing
      # can skip the expensive install) exits non-zero exactly like a clean
      # "nothing to do" answer, and `if cmd; then ... else ...` cannot tell
      # the two apart. That silently no-opped every scheduled run for days
      # with the job still showing green. So: only trust an explicit "data
      # is current" (or the cooldown message) in the script's own stdout.
      # Anything else — including a traceback — falls through to running
      # the real ingest, which is always safe and idempotent.
      - name: Is the stored data behind?
        id: check
        run: |
          set +e
          output=$(python ingest/refresh_data.py --check 2>&1)
          code=$?
          echo "$output"
          if [ $code -eq 1 ] && { echo "$output" | grep -qE "^(data is current|behind, but a refresh ran)"; }; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run ingest
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: python ingest/refresh_data.py

      # NFL is a separate database, a separate source (nflverse parquet) and a
      # separate dependency, so it gets its own steps rather than being folded
      # into the MLB ingest — a bad NFL run must not be able to stop baseball
      # data landing. nflreadpy is installed HERE rather than in
      # requirements.txt because the Streamlit app never imports it (it only
      # reads nfl.db), and putting it there would make every app deploy pull
      # polars for nothing.
      # Same reasoning as the MLB check above — only an explicit "data is
      # current" skips; a crash runs the ingest instead of hiding as a no-op.
      - name: Is the NFL data behind?
        id: nfl_check
        run: |
          set +e
          output=$(python ingest/nfl_refresh.py --check 2>&1)
          code=$?
          echo "$output"
          if [ $code -eq 1 ] && { echo "$output" | grep -q "^data is current"; }; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Refresh NFL data
        if: steps.nfl_check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install nflreadpy
          python ingest/nfl_refresh.py
        continue-on-error: true

      # On 2026-08-30 this step failed twice in a row with a bare "exit code
      # 128" and no visible cause — the ingest itself succeeded both times,
      # but the freshly-fetched data was silently discarded when the runner
      # tore down, leaving the site stuck a day behind with every check still
      # green. `safe.directory` (a git 2.35.2+ "dubious ownership" check that
      # can trip on GitHub's runner images) is the most common cause of an
      # unexplained exit 128 here, so it's set defensively even though it
      # couldn't be confirmed as THE cause — the logs for a public repo are
      # gated behind sign-in and weren't reachable to diagnose further. The
      # retry loop is the real fix for the underlying failure mode: git pull
      # --rebase races a same-day manual push (exactly what happened, twice)
      # and there is no reason a transient non-fast-forward should burn the
      # whole day's ingest instead of just re-fetching and trying again.
      - name: Commit updated data
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.db data/nfl.db
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying in 10s"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Commit updated data: all push attempts failed"
          exit 1
