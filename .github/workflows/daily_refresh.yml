name: Daily data refresh

on:
  schedule:
    # Times are UTC; 13:00 UTC is 06:00 Pacific in summer, 05:00 in winter
    # (GitHub cron has no DST awareness, so one UTC hour cannot be 6am
    # Pacific year-round).
    #
    # These are RETRIES, not extra refreshes, and the spread is wide on
    # purpose. GitHub runs scheduled jobs best-effort: observed delays on
    # this repo range from 30 minutes to over seven hours, and on 2026-08-27
    # the 13:00 slot was dropped with no run recorded at all. A cluster of
    # slots inside one narrow window is therefore no protection — if that
    # window is being deprioritised, every slot in it misses together.
    #
    # Each run asks `refresh_data.py --check`, which tests whether the DATA
    # is behind rather than whether a job has run, so a slot that fires at
    # any hour still does the right thing and the rest cost a few seconds.
    - cron: "0 13,16,19,22 * * *"
  workflow_dispatch: {}  # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

# Never let two refreshes write data/stats.db at once — a retry slot must
# not race a still-running earlier slot.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Is the stored data behind?
        id: check
        run: |
          if python ingest/refresh_data.py --check; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run ingest
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: python ingest/refresh_data.py

      # NFL is a separate database, a separate source (nflverse parquet) and a
      # separate dependency, so it gets its own steps rather than being folded
      # into the MLB ingest — a bad NFL run must not be able to stop baseball
      # data landing. nflreadpy is installed HERE rather than in
      # requirements.txt because the Streamlit app never imports it (it only
      # reads nfl.db), and putting it there would make every app deploy pull
      # polars for nothing.
      - name: Is the NFL data behind?
        id: nfl_check
        run: |
          if python ingest/nfl_refresh.py --check; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Refresh NFL data
        if: steps.nfl_check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install nflreadpy
          python ingest/nfl_refresh.py
        continue-on-error: true

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.db data/nfl.db
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
